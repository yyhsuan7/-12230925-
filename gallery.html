  <style> 
    body {
      margin: 0;
      background-color: black;
      overflow-y: scroll;
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: #888;
    }

    .line {
      position: absolute;
      width: 1px;
      background-color: rgba(255, 255, 255, 0.1);
      height: 100vh;
      z-index: 0;
    }

    .line::after {
      content: "";
      position: absolute;
      left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 37, 190, 0.8));
      animation: fall var(--ani-duration) var(--ani-delay) linear infinite;
    }

    @keyframes fall {
      0% {
        top: -100px;
      }

      100% {
        top: 100%;
      }
    }

    .image-numbered img {
      border: 2px solid #ccc;
      box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .image-numbered img:hover {
      transform: scale(1.05);
      box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.5);
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .overlay img {
      max-width: 90%;
      max-height: 90%;
      transition: transform 0.3s ease;
    }

    .overlay.active {
      display: flex;
    }
  </style>
</head>

  <!-- 放大圖片的遮罩 -->
  <div class="overlay" onclick="hideOverlay()">
    <img src="" alt="Enlarged Image">
  </div>

  <script>
    const overlay = document.querySelector('.overlay');
    const overlayImage = overlay.querySelector('img');

    function showOverlay(element) {
      const imgSrc = element.querySelector('img').src;
      overlayImage.src = imgSrc;
      overlay.classList.add('active');
    }

    function hideOverlay() {
      overlay.classList.remove('active');
    }

    window.addEventListener('scroll', () => {
      if (overlay.classList.contains('active')) {
        overlayImage.style.transform = `translateY(${window.scrollY}px)`;
      }
    });
  </script>
