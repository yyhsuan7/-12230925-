<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高級網頁設計</title>
    <style>
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; /* 每個按鈕之間的間距 */
        }
        .menu li {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 10px 20px;
            font-size: 1.5rem;
            cursor: pointer;
            position: relative;
        }
        .menu li a {
            text-decoration: none;
            color: #ffffff; /* 設定文字顏色為白色 */
            transition: color 0.3s ease;
        }
        .menu li a:hover {
            color: #ffcc00; /* 滑鼠懸停時文字變成金黃色 */
        }
        .menu li::after {
            content: '';
            display: block;
            width: 0;
            height: 2px;
            background: #fffcfc;
            transition: width .3s;
            position: absolute;
            bottom: -5px;
            left: 0;
        }
        .menu li:hover::after {
            width: 100%;
        }
        .image {
            width: 300px;
            height: 200px;
            margin: 50px auto;
            background-image: url('您的高品質圖片路徑');
            background-size: cover;
            background-position: center;
            transform: rotateY(0deg);
            transition: transform 1s;
        }
        .image:hover {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <ul class="menu">
            <li><a href="ABOUT.HTML">我</a></li>
            <li><a href="gallery.html">的作品</a></li>
            <li><a href="favorite.html">和興趣</a></li>
        </ul>
        <div class="image"></div>
    </div>
    <!-- 引入 GSAP 庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
    <script>
        // 使用 GSAP 創建滾動觸發動畫
        gsap.from('.menu li', {
            opacity: 0,
            y: -50,
            duration: 1,
            stagger: 0.2,
            ease: 'power2.out'
        });
    </script>
</body>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation with Background Effect</title>
    <style>
        /* 背景效果相關樣式 */
        body {
            margin: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: white;
        }

        .line {
            position: absolute;
            width: 1px;
            background-color: rgba(255, 255, 255, 0.1);
            height: 100vh;
            z-index: 0;
        }

        .line::after {
            content: "";
            position: absolute;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 37, 190, 0.8));
            animation: fall var(--ani-duration) var(--ani-delay) linear infinite;
        }

        @keyframes fall {
            0% {
                top: -100px;
            }

            100% {
                top: 100%;
            }
        }

        /* 頁面結構相關樣式 */
        nav {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
        }

        nav p a {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 20px;
        }

        nav ul li {
            position: relative;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 18px;
        }

        nav ul li ul {
            display: none;
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            list-style: none;
        }

        nav ul li:hover ul {
            display: block;
        }

        .hero {
            position: relative;
            z-index: 2;
            flex: 1;
            display: grid;
            place-content: center;
            text-align: center;
        }

        .slogan h1 {
            font-size: 4rem;
        }

        .slogan .button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #cb49fb;
            color: black;
            font-size: 1.2rem;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            border-radius: 30px; /* 圓角設定 */
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .slogan .button:hover {
            background: #e065ff;
            transform: scale(1.1); /* 當滑鼠懸停時放大效果 */
        }

        footer {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.8);
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>

    <script>
        const lineCount = 20;

        for (let i = 1; i <= lineCount; i++) {
            const line = document.createElement("div");
            line.classList.add("line");
            line.style.setProperty(
                "left",
                `${i * (100 / lineCount) + Math.random() * 5 - 5}%`
            );
            line.style.setProperty("--ani-duration", 8 + Math.random() * 10 + "s");
            line.style.setProperty("--ani-delay", -Math.random() * 10 + "s");
            document.body.appendChild(line);
        }
    </script>
</body>



</html>

</html>
